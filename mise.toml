[tools]
godot = "4.7.2-stable"
node = "26"
"npm:@coding-solo/godot-mcp" = "0.1.1"

[env]
# Godot MCP server only honours GODOT_PATH (it never searches PATH), so resolve
# the mise-managed binary after tools are on PATH.
GODOT_PATH = { value = "{{ exec(command='command -v godot') }}", tools = true }

[tasks.editor]
description = "Open the project in the Godot editor"
run = "godot --editor --path ."

[tasks.run]
description = "Run the project (main scene); imports first so new scripts and classes are registered"
depends = ["import"]
run = "godot --path ."

[tasks.run-skeleton]
description = "Run the skeleton viewer scene (sector boxes around the camera); imports first"
depends = ["import"]
run = "godot --path . scenes/skeleton_viewer.tscn"

[tasks.import]
description = "Import all assets headlessly (regenerates .godot/)"
run = "godot --headless --path . --import"

[tasks.check-scripts]
description = "Parse every GDScript file and fail on errors"
depends = ["import"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
status=0
while IFS= read -r -d '' file; do
	godot --headless --path . --check-only --script "res://${file#./}" || status=1
done < <(find . -path ./.godot -prune -o -name '*.gd' -print0)
exit "$status"
'''

[tasks.smoke]
description = "Run the main scene and the skeleton viewer headlessly for 60 frames each and fail on any script or scene error"
depends = ["import"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
log="$(mktemp)"
trap 'rm -f "$log"' EXIT

# Headless uses the dummy renderer, so shaders are never compiled here and
# produce no messages; shader errors are not caught by this task.
patterns=(-e 'SCRIPT ERROR' -e 'ERROR:' -e 'Parse Error' -e 'invalid UID')
# Known benign lines (grep -E patterns) to ignore. Empty: the run log is clean.
allow=()

# The main scene (no scene argument), then every other runnable scene.
scenes=("" scenes/skeleton_viewer.tscn)
for scene in "${scenes[@]}"; do
	echo "smoke: ${scene:-main scene}"
	status=0
	timeout 120 godot --headless --path . ${scene:+"$scene"} --quit-after 60 2>&1 | tee -a "$log" || status=$?
	if [[ "$status" -ne 0 ]]; then
		echo "smoke: godot exited with status $status running ${scene:-the main scene}" >&2
		exit 1
	fi
done

offending="$(grep -F "${patterns[@]}" "$log" || true)"
for allowed in "${allow[@]}"; do
	offending="$(printf '%s\n' "$offending" | grep -Ev -- "$allowed" || true)"
done
if [[ -n "$offending" ]]; then
	echo "smoke: errors in the run log:" >&2
	printf '%s\n' "$offending" >&2
	exit 1
fi
echo "smoke: ok"
'''

[tasks.skeleton-stats]
depends = ["import"]
description = "Measure the sector grammar over 20 random 5^3 regions per seed 0..4 (shaft runs, non-solid components, type fractions, cavity clusters) and fail below the structure thresholds (headless)"
run = "godot --headless --path . --script res://scripts/tools/skeleton_stats.gd"

[tasks.panel-check]
depends = ["import"]
description = "Click every kind of script-backed widget in the skeleton viewer's tweak panel (bool boxes and labels, int and float spin boxes, a slider) and check each setter ran (headless)"
run = "godot --headless --path . --script res://scripts/tools/panel_check.gd"

[tasks.check]
description = "Import assets, parse scripts, run the main and skeleton viewer scenes, click through the viewer tweak panel, run the skeleton histogram regression and structure statistics and verify the project loads headlessly"
depends = ["import", "check-scripts", "smoke", "panel-check", "skeleton-histogram", "skeleton-stats"]
run = "godot --headless --editor --path . --quit"

[tasks.templates]
description = "Download export templates for the pinned Godot version (skips if installed)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# "4.7.2.stable.official.ed1daf0bf" -> "4.7.2.stable"
full_version="$(godot --headless --version | tail -n 1)"
version="$(printf '%s\n' "$full_version" | cut -d. -f1-4)"
IFS=. read -r major minor patch status <<< "$version"
if [[ -z "${status:-}" ]]; then
	echo "Unexpected Godot version string: $full_version" >&2
	exit 1
fi

# Release tags drop a zero patch level: 4.7.0 ships as "4.7-stable".
if [[ "$patch" == "0" ]]; then
	tag="${major}.${minor}-${status}"
else
	tag="${major}.${minor}.${patch}-${status}"
fi

# Godot's editor data folder: ~/Library/Application Support/Godot on macOS,
# $XDG_DATA_HOME/godot elsewhere.
if [[ "$(uname -s)" == "Darwin" ]]; then
	data_dir="$HOME/Library/Application Support/Godot"
else
	data_dir="${XDG_DATA_HOME:-$HOME/.local/share}/godot"
fi
dest="$data_dir/export_templates/$version"
if [[ -f "$dest/version.txt" ]]; then
	echo "Export templates $version already installed in $dest"
	exit 0
fi

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

url="https://github.com/godotengine/godot/releases/download/${tag}/Godot_v${tag}_export_templates.tpz"
echo "Downloading $url"
progress=(--silent --show-error)
[[ -t 2 ]] && progress=(--progress-bar)
curl --fail --location "${progress[@]}" --output "$tmp/templates.tpz" "$url"
unzip -q "$tmp/templates.tpz" -d "$tmp"

mkdir -p "$(dirname "$dest")"
rm -rf "$dest"
mv "$tmp/templates" "$dest"
echo "Installed export templates $version in $dest"
'''

[tasks.export]
description = "Export a release build. Usage: mise run export <preset> <output-path>"
depends = ["import"]
run = [
	'mkdir -p "$(dirname "${usage_output}")"',
	'godot --headless --path . --export-release "${usage_preset}" "${usage_output}"',
]
usage = '''
arg "<preset>" help="Export preset name from export_presets.cfg"
arg "<output>" help="Output file path, e.g. build/linux/megastructure.x86_64"
'''

[tasks.export-debug]
description = "Export a debug build. Usage: mise run export-debug <preset> <output-path>"
depends = ["import"]
run = [
	'mkdir -p "$(dirname "${usage_output}")"',
	'godot --headless --path . --export-debug "${usage_preset}" "${usage_output}"',
]
usage = '''
arg "<preset>" help="Export preset name from export_presets.cfg"
arg "<output>" help="Output file path"
'''

[tasks."release:notes"]
description = "Print the Unreleased section of docs/CHANGELOG.md (the notes of the next release)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Everything between "## Unreleased" and the next "## " heading, without
# leading and trailing blank lines.
awk '
/^## Unreleased[[:space:]]*$/ { inside = 1; next }
inside && /^## / { exit }
inside && NF == 0 { if (started) blank++; next }
inside { while (blank > 0) { print ""; blank-- }; started = 1; print }
' docs/CHANGELOG.md
'''

[tasks."release:changelog-roll"]
description = "Rename Unreleased in docs/CHANGELOG.md to '<version> - <date>', open a fresh Unreleased section and commit. Usage: mise run release:changelog-roll <version>"
run = '''
#!/usr/bin/env bash
set -euo pipefail
dry_run=false
[[ "${usage_dry_run:-false}" == "true" ]] && dry_run=true

version="${usage_version}"
date="${usage_date:-$(date +%Y-%m-%d)}"
changelog=docs/CHANGELOG.md

if ! grep -q '^## Unreleased[[:space:]]*$' "$changelog"; then
	echo "release:changelog-roll: $changelog has no '## Unreleased' heading" >&2
	exit 1
fi
if grep -q "^## $version " "$changelog"; then
	echo "release:changelog-roll: $changelog already has a $version section" >&2
	exit 1
fi

run() { printf '+' >&2; printf ' %q' "$@" >&2; printf '\n' >&2; $dry_run || "$@"; }
run perl -0pi -e "s/^## Unreleased[ \\t]*\\n/## Unreleased\\n\\n## $version - $date\\n/m" "$changelog"
run git add "$changelog"
run git commit --quiet -m "chore(release): $version"
'''
usage = '''
arg "<version>" help="Version the Unreleased entries are released as, e.g. 0.1.0"
flag "--date <date>" help="Release date, YYYY-MM-DD (default: today)"
flag "-n --dry-run" help="Print the commands instead of editing and committing"
'''

[tasks."release:bump"]
description = "Bump config/version in project.godot, commit it (and push with --push) and print the new version. Usage: mise run release:bump <patch|minor|major>"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# RULE: develop always carries the NEXT, unreleased version. release:release
# calls this with "patch" right after tagging; run it by hand with "minor" or
# "major" at a milestone boundary (e.g. 0.1.3 -> 0.2.0), before releasing that
# milestone. Only the new version goes to stdout.

dry_run=false
[[ "${usage_dry_run:-false}" == "true" ]] && dry_run=true

old="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
if [[ ! "$old" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
	echo "release:bump: config/version in project.godot is not MAJOR.MINOR.PATCH: '$old'" >&2
	exit 1
fi
major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
case "${usage_part}" in
	patch) new="$major.$minor.$((patch + 1))" ;;
	minor) new="$major.$((minor + 1)).0" ;;
	major) new="$((major + 1)).0.0" ;;
	*) echo "release:bump: part must be patch, minor or major, not '${usage_part}'" >&2; exit 1 ;;
esac

run() { printf '+' >&2; printf ' %q' "$@" >&2; printf '\n' >&2; $dry_run || "$@"; }
run perl -pi -e "s/^config\\/version=\"\\Q$old\\E\"\$/config\\/version=\"$new\"/" project.godot
run git add project.godot
run git commit --quiet -m "chore(release): start $new"
if [[ "${usage_push:-false}" == "true" ]]; then
	run git push --quiet origin "$(git rev-parse --abbrev-ref HEAD)"
fi
echo "release:bump: $old -> $new" >&2
echo "$new"
'''
usage = '''
arg "<part>" help="Which part to bump: patch, minor or major"
flag "--push" help="Push the current branch to origin after committing"
flag "-n --dry-run" help="Print the commands instead of editing and committing"
'''

[tasks."release:set"]
description = "Set config/version in project.godot to an explicit version and commit it (and push with --push). Usage: mise run release:set <version>"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# RULE: develop always carries the NEXT, unreleased version. Between milestones
# that is the next patch; the minor bump happens right before a milestone is
# released. Use this task to correct the version when it drifted from that
# rule (e.g. 0.2.0 -> 0.1.1 while milestone 0.2.0 is still open). Only the new
# version goes to stdout.

dry_run=false
[[ "${usage_dry_run:-false}" == "true" ]] && dry_run=true

new="${usage_version}"
if [[ ! "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
	echo "release:set: version must be MAJOR.MINOR.PATCH, not '$new'" >&2
	exit 1
fi
old="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
if [[ "$old" == "$new" ]]; then
	echo "release:set: config/version is already $new" >&2
	echo "$new"
	exit 0
fi
if git tag --list "v$new" | grep -q .; then
	echo "release:set: v$new is already released (tag exists)" >&2
	exit 1
fi

run() { printf '+' >&2; printf ' %q' "$@" >&2; printf '\n' >&2; $dry_run || "$@"; }
run perl -pi -e "s/^config\\/version=\"\\Q$old\\E\"\$/config\\/version=\"$new\"/" project.godot
run git add project.godot
run git commit --quiet -m "chore(release): set version to $new"
if [[ "${usage_push:-false}" == "true" ]]; then
	run git push --quiet origin "$(git rev-parse --abbrev-ref HEAD)"
fi
echo "release:set: $old -> $new" >&2
echo "$new"
'''
usage = '''
arg "<version>" help="The version to write, MAJOR.MINOR.PATCH"
flag "--push" help="Push the current branch to origin after committing"
flag "-n --dry-run" help="Print the commands instead of editing and committing"
'''

[tasks."release:package"]
description = "Package an exported build into build/release/. Usage: mise run release:package <linux|macos>"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
if [[ -z "$version" ]]; then
	echo "release:package: no config/version in project.godot" >&2
	exit 1
fi
# In the release workflow the packaged version must be the released tag.
if [[ "${GITHUB_EVENT_NAME:-}" == "release" && "${GITHUB_REF_NAME:-}" != "v$version" ]]; then
	echo "release:package: tag ${GITHUB_REF_NAME} does not match config/version $version" >&2
	exit 1
fi

mkdir -p build/release
case "${usage_preset}" in
	linux)
		binary=build/linux/megastructure.x86_64
		[[ -f "$binary" ]] || { echo "release:package: $binary missing, run: mise run export linux $binary" >&2; exit 1; }
		files=(megastructure.x86_64)
		[[ -f build/linux/megastructure.pck ]] && files+=(megastructure.pck)
		archive="build/release/megastructure-$version-linux-x86_64.tar.gz"
		tar -czf "$archive" -C build/linux "${files[@]}"
		;;
	macos)
		zip=build/macos/megastructure.zip
		[[ -f "$zip" ]] || { echo "release:package: $zip missing, run: mise run export macos $zip" >&2; exit 1; }
		archive="build/release/megastructure-$version-macos-universal.zip"
		cp "$zip" "$archive"
		;;
	*)
		echo "release:package: unknown preset '${usage_preset}' (linux or macos)" >&2
		exit 1
		;;
esac
echo "$archive"
'''
usage = '''
arg "<preset>" help="Export preset that was exported: linux or macos"
'''

[tasks."release:release"]
description = "Release the version in project.godot: changelog, tag, GitHub release, then bump develop to the next patch"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# RULE: develop always carries the NEXT version. This task tags the version
# that is already in project.godot and never edits the version before
# tagging; right after the release it bumps develop to the next patch. So the
# version in project.godot on develop is always unreleased.
#
# Steps (each change is its own task): check preconditions, release:notes,
# release:changelog-roll (commits), tag vVERSION and push, create the GitHub
# release (the release workflow builds and attaches the Linux and macOS
# archives), release:bump patch (commits) and push. With --dry-run every command
# is printed instead of executed; the sub-tasks run in their own dry-run mode.

dry_run=false
dry_flag=()
if [[ "${usage_dry_run:-false}" == "true" ]]; then
	dry_run=true
	dry_flag=(--dry-run)
fi

show() { printf '+' >&2; printf ' %q' "$@" >&2; printf '\n' >&2; }
run() { show "$@"; $dry_run || "$@"; }
# Sub-tasks always run; they honour --dry-run themselves.
task() { show mise run "$@"; mise run --quiet "$@"; }

fail() {
	if $dry_run; then
		echo "dry-run: would refuse: $*" >&2
	else
		echo "release:release: $*" >&2
		exit 1
	fi
}

# 1. Preconditions. Fetching is read-only, so it also runs in a dry run.
branch="$(git rev-parse --abbrev-ref HEAD)"
[[ "$branch" == "develop" ]] || fail "not on develop (on $branch)"
[[ -z "$(git status --porcelain)" ]] || fail "working tree is not clean"
show git fetch --quiet origin develop --tags
git fetch --quiet origin develop --tags
if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/develop)" ]]; then
	fail "develop is not up to date with origin/develop"
fi
gh auth status >/dev/null 2>&1 || fail "gh is not authenticated (gh auth login)"

# 2. The version to release is the one develop already carries.
version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
	echo "release:release: config/version in project.godot is not MAJOR.MINOR.PATCH: '$version'" >&2
	exit 1
fi
tag="v$version"
git rev-parse -q --verify "refs/tags/$tag" >/dev/null && fail "tag $tag already exists"

notes="$(mktemp)"
trap 'rm -f "$notes"' EXIT
task release:notes > "$notes"
[[ -s "$notes" ]] || fail "the Unreleased section of docs/CHANGELOG.md is empty"
echo "Releasing $tag"
if $dry_run; then
	echo "dry-run: release notes:"
	sed 's/^/  | /' "$notes"
fi

# 3. Date the changelog section, open a fresh Unreleased one above it, commit.
task release:changelog-roll "$version" "${dry_flag[@]}"

# 4. Tag and push develop and the tag together.
run git tag -a "$tag" -m "$tag"
run git push --atomic origin develop "refs/tags/$tag"

# 5. The GitHub release triggers .github/workflows/release.yml.
run gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"

# 6. develop moves on to the next, unreleased version (commits).
task release:bump patch "${dry_flag[@]}" >/dev/null
run git push origin develop

# 7. Where to find it.
if $dry_run; then
	show gh release view "$tag" --json url --jq .url
else
	gh release view "$tag" --json url --jq .url
fi
'''
usage = '''
flag "-n --dry-run" help="Print every command instead of executing it"
'''

[tasks."wt:new"]
description = "Create an issue worktree on a new branch <issue>-<slug> from origin/develop and print its path. Usage: mise run wt:new <issue> <slug>"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# The worktree goes to <base-dir>/<issue>-<slug>, next to the other issue
# worktrees. Only the path goes to stdout, so `cd "$(mise run wt:new ...)"`
# works.

dry_run=false
[[ "${usage_dry_run:-false}" == "true" ]] && dry_run=true

show() { printf '+' >&2; printf ' %q' "$@" >&2; printf '\n' >&2; }
run() { show "$@"; $dry_run || "$@"; }
fail() { echo "wt:new: $*" >&2; exit 1; }

issue="${usage_issue}"
slug="${usage_slug}"
[[ "$issue" =~ ^[1-9][0-9]*$ ]] || fail "issue must be a number, not '$issue'"
[[ "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || fail "slug must be lowercase words joined by '-', not '$slug'"
branch="$issue-$slug"

base_dir="${usage_base_dir:-${WT_BASE_DIR:-$HOME/.herdr/worktrees/megastructure}}"
path="$base_dir/$branch"
# The main checkout is the first entry of the worktree list.
main="$(git worktree list --porcelain | sed -n '1s/^worktree //p')"

git -C "$main" show-ref --quiet --verify "refs/heads/$branch" && fail "branch $branch already exists"
[[ -e "$path" ]] && fail "$path already exists"

run git -C "$main" fetch --quiet origin develop
if [[ "${usage_herdr:-false}" == "true" ]]; then
	[[ "${HERDR_ENV:-}" == "1" ]] || fail "--herdr needs HERDR_ENV=1 (run it inside Herdr)"
	run herdr worktree create --cwd "$main" --branch "$branch" --base origin/develop \
		--path "$path" --label "$branch" --no-focus
else
	run git -C "$main" worktree add --quiet -b "$branch" "$path" origin/develop
fi
# A worktree is a new directory, so mise asks to trust its mise.toml again.
run mise trust --quiet "$path/mise.toml"
echo "$path"
'''
usage = '''
arg "<issue>" help="GitHub issue number, e.g. 110"
arg "<slug>" help="Short kebab-case name, e.g. coordination-tasks"
flag "--base-dir <dir>" help="Folder the worktree is created in (default: $WT_BASE_DIR or ~/.herdr/worktrees/megastructure)"
flag "--herdr" help="Create it with 'herdr worktree create' as a Herdr workspace (needs HERDR_ENV=1)"
flag "-n --dry-run" help="Print the commands instead of creating anything"
'''

[tasks."wt:rm"]
description = "Remove an issue worktree and delete its branch, refusing if anything would be lost. Usage: mise run wt:rm <branch>"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Refuses when the worktree has uncommitted changes or an unfinished rebase,
# merge or cherry-pick, or when the branch has commits that are on no branch
# of origin (after a fetch --prune). A branch merged into develop is safe to
# delete because its commits are reachable from origin/develop.

dry_run=false
[[ "${usage_dry_run:-false}" == "true" ]] && dry_run=true

show() { printf '+' >&2; printf ' %q' "$@" >&2; printf '\n' >&2; }
run() { show "$@"; $dry_run || "$@"; }
fail() { echo "wt:rm: $*" >&2; exit 1; }

branch="${usage_branch}"
main="$(git worktree list --porcelain | sed -n '1s/^worktree //p')"
case "$branch" in
	develop | main | master) fail "refusing to remove $branch" ;;
esac
git -C "$main" show-ref --quiet --verify "refs/heads/$branch" || fail "no local branch $branch"

# The worktree that has the branch checked out, also while a rebase has
# detached its HEAD.
worktree_of() {
	local wt="" line git_dir
	while IFS= read -r line; do
		case "$line" in
			"worktree "*) wt="${line#worktree }" ;;
			"branch refs/heads/$1") echo "$wt"; return ;;
			detached)
				git_dir="$(git -C "$wt" rev-parse --absolute-git-dir 2>/dev/null)" || continue
				if grep -qsx "refs/heads/$1" "$git_dir/rebase-merge/head-name" "$git_dir/rebase-apply/head-name"; then
					echo "$wt"
					return
				fi
				;;
		esac
	done < <(git -C "$main" worktree list --porcelain)
}
worktree="$(worktree_of "$branch")"

if [[ -n "$worktree" ]]; then
	[[ "$worktree" == "$main" ]] && fail "$branch is checked out in the main checkout $main"
	here="$(git rev-parse --show-toplevel)"
	[[ "$here" == "$worktree" ]] && fail "run this from another checkout, not from $worktree itself"
	git_dir="$(git -C "$worktree" rev-parse --absolute-git-dir)"
	for marker in rebase-merge rebase-apply MERGE_HEAD CHERRY_PICK_HEAD REVERT_HEAD; do
		[[ -e "$git_dir/$marker" ]] && fail "$worktree has an unfinished operation ($marker); finish or abort it first"
	done
	if [[ -n "$(git -C "$worktree" status --porcelain)" ]]; then
		git -C "$worktree" status --short >&2
		fail "$worktree has uncommitted changes"
	fi
fi

# Fetching is read-only, so it also runs in a dry run.
show git -C "$main" fetch --quiet --prune origin
git -C "$main" fetch --quiet --prune origin
unpushed="$(git -C "$main" rev-list --count "refs/heads/$branch" --not --remotes=origin)"
if [[ "$unpushed" -gt 0 ]]; then
	git -C "$main" log --oneline "refs/heads/$branch" --not --remotes=origin >&2
	fail "$branch has $unpushed commit(s) that are on no branch of origin; push or merge them first"
fi

[[ -n "$worktree" ]] && run git -C "$main" worktree remove "$worktree"
run git -C "$main" branch -D "$branch"
run git -C "$main" worktree prune
'''
usage = '''
arg "<branch>" help="Branch of the worktree, e.g. 110-coordination-tasks"
flag "-n --dry-run" help="Run the checks and print the commands instead of removing anything"
'''

[tasks."pr:status"]
description = "List open pull requests with their merge state and check results"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# GitHub computes mergeStateStatus lazily: UNKNOWN right after a push means
# "not computed yet", not a problem. Run it again a few seconds later.
{
	printf 'PR\tBRANCH\tMERGE STATE\tCHECKS\tTITLE\n'
	gh pr list --state open --limit 100 \
		--json number,title,headRefName,isDraft,mergeStateStatus,statusCheckRollup \
		--jq '.[] | [
			"#\(.number)",
			.headRefName,
			(if .isDraft then "DRAFT" else .mergeStateStatus end),
			([.statusCheckRollup[] |
				"\(.name // .context)=\(
					if (.conclusion // "") != "" then .conclusion
					elif (.state // "") != "" then .state
					else .status end | ascii_downcase)"
			] | if length == 0 then "none" else join(",") end),
			.title
		] | @tsv'
} | column -t -s $'\t'
'''

[tasks."pr:merge"]
description = "Rebase a pull request onto origin/develop, push, wait for its check, merge it with a merge commit and update develop. Usage: mise run pr:merge <number>"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Steps: resolve the PR's branch and worktree, fetch, rebase the worktree onto
# origin/develop (aborting on conflict), push --force-with-lease and verify
# origin has exactly the local HEAD, wait for the "check" check-run of that
# commit to succeed, merge with a merge commit (only if the PR head is still
# that commit), fast-forward develop in the main checkout and print the merge
# commit. With --dry-run the checks run and the current check state is shown,
# but every changing command is only printed.

dry_run=false
[[ "${usage_dry_run:-false}" == "true" ]] && dry_run=true
rebase=true
[[ "${usage_no_rebase:-false}" == "true" ]] && rebase=false
timeout="${usage_timeout:-900}"
interval=15
check_name=check

show() { printf '+' >&2; printf ' %q' "$@" >&2; printf '\n' >&2; }
run() { show "$@"; $dry_run || "$@"; }
say() { echo "pr:merge: $*" >&2; }
fail() {
	if $dry_run; then
		echo "dry-run: would refuse: $*" >&2
	else
		say "$*"
		exit 1
	fi
}

number="${usage_number}"
[[ "$number" =~ ^[1-9][0-9]*$ ]] || { say "PR number must be a number, not '$number'"; exit 1; }
[[ "$timeout" =~ ^[1-9][0-9]*$ ]] || { say "--timeout must be a number of seconds, not '$timeout'"; exit 1; }
main="$(git worktree list --porcelain | sed -n '1s/^worktree //p')"

# 1. The pull request, its branch and its worktree.
info="$(gh pr view "$number" \
	--json state,baseRefName,headRefName,isCrossRepository,url \
	--jq '[.state, .baseRefName, .headRefName, .isCrossRepository, .url] | @tsv')"
IFS=$'\t' read -r state base branch cross url <<< "$info"
say "#$number $branch -> $base ($url)"
[[ "$state" == "OPEN" ]] || { say "#$number is $state, not OPEN"; exit 1; }
[[ "$base" == "develop" ]] || fail "#$number targets $base, not develop"
[[ "$cross" == "false" ]] || { say "#$number comes from a fork; merge it by hand"; exit 1; }

# The worktree that has the branch checked out, also while a rebase has
# detached its HEAD.
worktree_of() {
	local wt="" line git_dir
	while IFS= read -r line; do
		case "$line" in
			"worktree "*) wt="${line#worktree }" ;;
			"branch refs/heads/$1") echo "$wt"; return ;;
			detached)
				git_dir="$(git -C "$wt" rev-parse --absolute-git-dir 2>/dev/null)" || continue
				if grep -qsx "refs/heads/$1" "$git_dir/rebase-merge/head-name" "$git_dir/rebase-apply/head-name"; then
					echo "$wt"
					return
				fi
				;;
		esac
	done < <(git -C "$main" worktree list --porcelain)
}
worktree="$(worktree_of "$branch")"
if [[ -z "$worktree" ]]; then
	$rebase && { say "no worktree has $branch checked out; create one or pass --no-rebase"; exit 1; }
else
	say "worktree $worktree"
	git_dir="$(git -C "$worktree" rev-parse --absolute-git-dir)"
	for marker in rebase-merge rebase-apply MERGE_HEAD CHERRY_PICK_HEAD REVERT_HEAD; do
		[[ -e "$git_dir/$marker" ]] && { say "$worktree has an unfinished operation ($marker); finish or abort it first"; exit 1; }
	done
	if [[ -n "$(git -C "$worktree" status --porcelain --untracked-files=no)" ]]; then
		git -C "$worktree" status --short --untracked-files=no >&2
		fail "$worktree has uncommitted changes"
	fi
fi

# 2. Fetch (read-only, so it also runs in a dry run).
show git -C "$main" fetch --quiet origin develop "$branch"
git -C "$main" fetch --quiet origin develop "$branch"

# 3. Rebase onto origin/develop.
if [[ -n "$worktree" ]]; then
	behind="$(git -C "$worktree" rev-list --count "HEAD..refs/remotes/origin/$branch")"
	[[ "$behind" -eq 0 ]] || fail "origin/$branch has $behind commit(s) that $worktree lacks; pull them first"
fi
would_rebase=false
if $rebase; then
	if git -C "$worktree" merge-base --is-ancestor refs/remotes/origin/develop HEAD; then
		say "$branch already contains origin/develop, no rebase needed"
	else
		show git -C "$worktree" rebase origin/develop
		would_rebase=$dry_run
		if ! $dry_run && ! git -C "$worktree" rebase origin/develop; then
			say "rebase of $branch onto origin/develop stopped (conflict?); aborting it"
			git -C "$worktree" rebase --abort
			say "rebase aborted, $branch is unchanged; rebase and resolve by hand, then run pr:merge again"
			exit 1
		fi
	fi
fi

# 4. Push and make sure origin has exactly the commit that is polled.
if [[ -n "$worktree" ]]; then
	sha="$(git -C "$worktree" rev-parse HEAD)"
	remote_sha="$(git -C "$main" rev-parse "refs/remotes/origin/$branch")"
	if [[ "$sha" != "$remote_sha" ]]; then
		run git -C "$worktree" push --quiet --force-with-lease origin "$branch"
	fi
	if ! $dry_run; then
		pushed="$(git -C "$main" ls-remote origin "refs/heads/$branch" | cut -f1)"
		[[ "$pushed" == "$sha" ]] || { say "origin has $branch at ${pushed:-nothing}, expected $sha"; exit 1; }
	fi
else
	sha="$(git -C "$main" rev-parse "refs/remotes/origin/$branch")"
fi
$would_rebase && say "dry-run: after the rebase the polled commit would be the new HEAD, not ${sha:0:12}"

# 5. Wait for the check-run of that commit. No run yet counts as pending.
check_state() {
	gh api "repos/{owner}/{repo}/commits/$sha/check-runs?check_name=$check_name&per_page=100" \
		--jq '.check_runs | sort_by(.started_at) | last
			| if . == null then "pending none"
			elif .status != "completed" then "pending \(.status)"
			else "completed \(.conclusion)" end'
}
if $dry_run; then
	say "$check_name on ${sha:0:12}: $(check_state)"
	say "dry-run: would wait for $check_name to succeed (poll every ${interval}s, up to ${timeout}s)"
else
	deadline=$((SECONDS + timeout))
	last=""
	while :; do
		read -r phase detail < <(check_state)
		if [[ "$phase $detail" != "$last" ]]; then
			say "$check_name on ${sha:0:12}: $phase $detail"
			last="$phase $detail"
		fi
		if [[ "$phase" == "completed" ]]; then
			[[ "$detail" == "success" ]] && break
			say "$check_name on ${sha:0:12} finished with $detail; not merging"
			exit 1
		fi
		if ((SECONDS >= deadline)); then
			say "timed out after ${timeout}s waiting for $check_name on ${sha:0:12}"
			exit 1
		fi
		sleep "$interval"
	done
fi

# 6. Merge, but only if the PR head is still the commit that passed.
run gh pr merge "$number" --merge --match-head-commit "$sha"

# 7. Fast-forward develop in the main checkout.
main_branch="$(git -C "$main" rev-parse --abbrev-ref HEAD)"
if [[ "$main_branch" != "develop" ]]; then
	# develop is not checked out there: update the branch ref without a checkout.
	run git -C "$main" fetch --quiet origin develop:develop
elif [[ -z "$(git -C "$main" status --porcelain)" ]]; then
	run git -C "$main" pull --quiet --ff-only origin develop
elif $dry_run; then
	show git -C "$main" stash push --include-untracked -m "pr:merge-$number"
	show git -C "$main" pull --quiet --ff-only origin develop
	show git -C "$main" stash apply "<stash>"
	show git -C "$main" stash drop "<stash>"
else
	# The stash stack is shared by all worktrees: address the entry by its
	# commit, never by position.
	tag="pr:merge-$number-$(date +%s)-$$"
	show git -C "$main" stash push --include-untracked -m "$tag"
	git -C "$main" stash push --quiet --include-untracked -m "$tag"
	stash="$(git -C "$main" stash list --format='%H %gs' | awk -v tag="$tag" 'index($0, tag) { print $1; exit }')"
	[[ -n "$stash" ]] || { say "could not find the stash '$tag' in $main"; exit 1; }
	pulled=true
	show git -C "$main" pull --quiet --ff-only origin develop
	git -C "$main" pull --quiet --ff-only origin develop || pulled=false
	show git -C "$main" stash apply "$stash"
	if ! git -C "$main" stash apply --quiet "$stash"; then
		say "local changes in $main did not apply cleanly; they are kept in stash $stash ($tag)"
		exit 1
	fi
	entry="$(git -C "$main" stash list --format='%gd %H' | awk -v sha="$stash" '$2 == sha { print $1; exit }')"
	[[ -n "$entry" ]] && run git -C "$main" stash drop --quiet "$entry"
	$pulled || { say "git pull --ff-only failed in $main; develop was not updated"; exit 1; }
fi

# 8. The merge commit.
if $dry_run; then
	show gh pr view "$number" --json mergeCommit --jq .mergeCommit.oid
else
	merge="$(gh pr view "$number" --json mergeCommit --jq .mergeCommit.oid)"
	git -C "$main" log -1 --oneline "$merge" 2>/dev/null || echo "$merge"
fi
'''
usage = '''
arg "<number>" help="Pull request number"
flag "--no-rebase" help="Do not rebase or push; wait for the check of the pushed head and merge it"
flag "--timeout <seconds>" default="900" help="How long to wait for the check to finish"
flag "-n --dry-run" help="Run the checks and show the check state, print every changing command instead"
'''

[tasks.mcp]
description = "Run the Godot MCP server over stdio (used by .mcp.json)"
run = "godot-mcp"

[tasks.clean]
description = "Remove generated import cache and build output"
run = "rm -rf .godot build"

[tasks.hash-vectors]
depends = ["import"]
description = "Print the shared integer hash reference vectors (see docs/hash_vectors.md)"
run = "godot --headless --path . --script res://scripts/tools/hash_vectors.gd"

[tasks.ui-params]
depends = ["import"]
description = "Print the shader parameter groups the tweak panel discovers"
run = "godot --headless --path . --script res://scripts/tools/registry_dump.gd"

[tasks.seed-check]
depends = ["import"]
description = "Verify seed control, shader uniform and seed-reproducible frames (opens a window)"
run = "godot --path . --script res://scripts/tools/seed_check.gd"

[tasks.screenshot-check]
depends = ["import"]
description = "Verify the HUD screenshot is saved with the HUD hidden (opens a window)"
run = "godot --path . --script res://scripts/tools/screenshot_check.gd"

[tasks.preset-check]
depends = ["import"]
description = "Verify presets save, reload and restore every value bitwise (headless)"
run = "godot --headless --path . --script res://scripts/tools/preset_check.gd"

[tasks.code-map-check]
depends = ["import"]
description = "Verify every file under scripts/, shaders/ and scenes/ is linked from exactly one docs/code note (headless)"
run = "godot --headless --path . --script res://scripts/tools/code_map_check.gd"

[tasks.skeleton-histogram]
depends = ["import"]
description = "Print the seed 0 sector type histogram, check sector_type is total and deterministic, and compare with docs/skeleton_histogram_seed0.md (headless). --update rewrites the reference"
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=()
[[ "${usage_update:-false}" == "true" ]] && args+=(--update)
godot --headless --path . --script res://scripts/tools/skeleton_histogram.gd -- "${args[@]}"
'''
usage = '''
flag "--update" help="Rewrite docs/skeleton_histogram_seed0.md from the current grammar instead of comparing"
'''

[tasks.shot]
depends = ["import"]
description = "Render one frame of a scene to a PNG without opening a window (under xvfb-run). Usage: mise run shot <scene> <out.png> [--seed N] [--pose x,y,z,yaw,pitch] [--frames N] [--params k=v,...]"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Under Xvfb there is no DRI3, so Vulkan finds no device that can present and
# Godot would fall back to Wayland and open a window. The task therefore uses
# the X11 display driver with OpenGL (Mesa llvmpipe, the Compatibility
# renderer) and unsets WAYLAND_DISPLAY so no fallback can reach the desktop.
# See docs/process/screenshots.md.
resolution="${usage_resolution:-1280x720}"
[[ "$resolution" =~ ^[1-9][0-9]*x[1-9][0-9]*$ ]] || { echo "shot: --resolution must be WIDTHxHEIGHT, not '$resolution'" >&2; exit 1; }
out="$(realpath -m -- "${usage_out}")"
# Keep Godot from importing shots written into a folder inside the project
# (never the project root itself, which a .gdignore would hide entirely).
out_dir="$(dirname "$out")"
if [[ "$out_dir" == "$PWD"/* ]]; then
	mkdir -p "$out_dir"
	touch "$out_dir/.gdignore"
fi

args=(-- "${usage_scene}" "$out" --resolution "$resolution" --frames "${usage_frames:-40}")
[[ -n "${usage_seed:-}" ]] && args+=(--seed "${usage_seed}")
[[ -n "${usage_pose:-}" ]] && args+=(--pose "${usage_pose}")
[[ -n "${usage_params:-}" ]] && args+=(--params "${usage_params}")
[[ "${usage_ui:-false}" == "true" ]] && args+=(--ui)
godot_args=(--path . --resolution "$resolution" --script res://scripts/tools/shot.gd)

if [[ "${usage_window:-false}" != "true" ]] && command -v xvfb-run >/dev/null; then
	env -u WAYLAND_DISPLAY xvfb-run -a -s "-screen 0 ${resolution}x24" \
		godot --display-driver x11 --rendering-driver opengl3 "${godot_args[@]}" "${args[@]}"
else
	if [[ "${usage_window:-false}" != "true" ]]; then
		echo "shot: xvfb-run not found, opening a window (install it: sudo pacman -S xorg-server-xvfb)" >&2
	fi
	godot "${godot_args[@]}" "${args[@]}"
fi
'''
usage = '''
arg "<scene>" help="Scene to render, e.g. scenes/main.tscn or res://scenes/skeleton_viewer.tscn"
arg "<out>" help="PNG file to write, relative to the project root, e.g. build/shots/main.png"
flag "--seed <n>" help="World seed (default: 1)"
flag "--pose <pose>" help="Camera pose x,y,z,yaw,pitch in the prototype convention (default: the scene's)"
flag "--frames <n>" default="40" help="Frames to wait before capturing"
flag "--params <params>" help="Registry params name=value,... (Vector2 x:y, Color #rrggbb or r:g:b[:a])"
flag "--resolution <size>" default="1280x720" help="Image size WIDTHxHEIGHT"
flag "--ui" help="Keep the HUD and tweak panel in the image"
flag "--window" help="Open a normal window instead of using xvfb-run (Vulkan, Forward+)"
'''
