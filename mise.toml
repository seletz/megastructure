[tools]
godot = "4.7.2-stable"
node = "26"
"npm:@coding-solo/godot-mcp" = "0.1.1"

[env]
# Godot MCP server only honours GODOT_PATH (it never searches PATH), so resolve
# the mise-managed binary after tools are on PATH.
GODOT_PATH = { value = "{{ exec(command='command -v godot') }}", tools = true }

[tasks.editor]
description = "Open the project in the Godot editor"
run = "godot --editor --path ."

[tasks.run]
description = "Run the project (main scene); imports first so new scripts and classes are registered"
depends = ["import"]
run = "godot --path ."

[tasks.import]
description = "Import all assets headlessly (regenerates .godot/)"
run = "godot --headless --path . --import"

[tasks.check-scripts]
description = "Parse every GDScript file and fail on errors"
depends = ["import"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
status=0
while IFS= read -r -d '' file; do
	godot --headless --path . --check-only --script "res://${file#./}" || status=1
done < <(find . -path ./.godot -prune -o -name '*.gd' -print0)
exit "$status"
'''

[tasks.smoke]
description = "Run the main scene headlessly for 60 frames and fail on any script or scene error"
depends = ["import"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
log="$(mktemp)"
trap 'rm -f "$log"' EXIT

# Headless uses the dummy renderer, so shaders are never compiled here and
# produce no messages; shader errors are not caught by this task.
patterns=(-e 'SCRIPT ERROR' -e 'ERROR:' -e 'Parse Error' -e 'invalid UID')
# Known benign lines (grep -E patterns) to ignore. Empty: the run log is clean.
allow=()

status=0
timeout 120 godot --headless --path . --quit-after 60 2>&1 | tee "$log" || status=$?
if [[ "$status" -ne 0 ]]; then
	echo "smoke: godot exited with status $status" >&2
	exit 1
fi

offending="$(grep -F "${patterns[@]}" "$log" || true)"
for allowed in "${allow[@]}"; do
	offending="$(printf '%s\n' "$offending" | grep -Ev -- "$allowed" || true)"
done
if [[ -n "$offending" ]]; then
	echo "smoke: errors in the run log:" >&2
	printf '%s\n' "$offending" >&2
	exit 1
fi
echo "smoke: ok"
'''

[tasks.check]
description = "Import assets, parse scripts, run the main scene and verify the project loads headlessly"
depends = ["import", "check-scripts", "smoke"]
run = "godot --headless --editor --path . --quit"

[tasks.templates]
description = "Download export templates for the pinned Godot version (skips if installed)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# "4.7.2.stable.official.ed1daf0bf" -> "4.7.2.stable"
full_version="$(godot --headless --version | tail -n 1)"
version="$(printf '%s\n' "$full_version" | cut -d. -f1-4)"
IFS=. read -r major minor patch status <<< "$version"
if [[ -z "${status:-}" ]]; then
	echo "Unexpected Godot version string: $full_version" >&2
	exit 1
fi

# Release tags drop a zero patch level: 4.7.0 ships as "4.7-stable".
if [[ "$patch" == "0" ]]; then
	tag="${major}.${minor}-${status}"
else
	tag="${major}.${minor}.${patch}-${status}"
fi

# Godot's editor data folder: ~/Library/Application Support/Godot on macOS,
# $XDG_DATA_HOME/godot elsewhere.
if [[ "$(uname -s)" == "Darwin" ]]; then
	data_dir="$HOME/Library/Application Support/Godot"
else
	data_dir="${XDG_DATA_HOME:-$HOME/.local/share}/godot"
fi
dest="$data_dir/export_templates/$version"
if [[ -f "$dest/version.txt" ]]; then
	echo "Export templates $version already installed in $dest"
	exit 0
fi

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

url="https://github.com/godotengine/godot/releases/download/${tag}/Godot_v${tag}_export_templates.tpz"
echo "Downloading $url"
progress=(--silent --show-error)
[[ -t 2 ]] && progress=(--progress-bar)
curl --fail --location "${progress[@]}" --output "$tmp/templates.tpz" "$url"
unzip -q "$tmp/templates.tpz" -d "$tmp"

mkdir -p "$(dirname "$dest")"
rm -rf "$dest"
mv "$tmp/templates" "$dest"
echo "Installed export templates $version in $dest"
'''

[tasks.export]
description = "Export a release build. Usage: mise run export <preset> <output-path>"
depends = ["import"]
run = [
	'mkdir -p "$(dirname "${usage_output}")"',
	'godot --headless --path . --export-release "${usage_preset}" "${usage_output}"',
]
usage = '''
arg "<preset>" help="Export preset name from export_presets.cfg"
arg "<output>" help="Output file path, e.g. build/linux/megastructure.x86_64"
'''

[tasks.export-debug]
description = "Export a debug build. Usage: mise run export-debug <preset> <output-path>"
depends = ["import"]
run = [
	'mkdir -p "$(dirname "${usage_output}")"',
	'godot --headless --path . --export-debug "${usage_preset}" "${usage_output}"',
]
usage = '''
arg "<preset>" help="Export preset name from export_presets.cfg"
arg "<output>" help="Output file path"
'''

[tasks."release:notes"]
description = "Print the Unreleased section of docs/CHANGELOG.md (the notes of the next release)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Everything between "## Unreleased" and the next "## " heading, without
# leading and trailing blank lines.
awk '
/^## Unreleased[[:space:]]*$/ { inside = 1; next }
inside && /^## / { exit }
inside && NF == 0 { if (started) blank++; next }
inside { while (blank > 0) { print ""; blank-- }; started = 1; print }
' docs/CHANGELOG.md
'''

[tasks."release:changelog-roll"]
description = "Rename Unreleased in docs/CHANGELOG.md to '<version> - <date>' and open a fresh Unreleased section. Usage: mise run release:changelog-roll <version>"
run = '''
#!/usr/bin/env bash
set -euo pipefail
dry_run=false
[[ "${usage_dry_run:-false}" == "true" ]] && dry_run=true

version="${usage_version}"
date="${usage_date:-$(date +%Y-%m-%d)}"
changelog=docs/CHANGELOG.md

if ! grep -q '^## Unreleased[[:space:]]*$' "$changelog"; then
	echo "release:changelog-roll: $changelog has no '## Unreleased' heading" >&2
	exit 1
fi
if grep -q "^## $version " "$changelog"; then
	echo "release:changelog-roll: $changelog already has a $version section" >&2
	exit 1
fi

cmd=(perl -0pi -e "s/^## Unreleased[ \\t]*\\n/## Unreleased\\n\\n## $version - $date\\n/m" "$changelog")
printf '+' >&2; printf ' %q' "${cmd[@]}" >&2; printf '\n' >&2
$dry_run || "${cmd[@]}"
'''
usage = '''
arg "<version>" help="Version the Unreleased entries are released as, e.g. 0.1.0"
flag "--date <date>" help="Release date, YYYY-MM-DD (default: today)"
flag "-n --dry-run" help="Print the command instead of editing the changelog"
'''

[tasks."release:bump"]
description = "Bump config/version in project.godot and print the new version. Usage: mise run release:bump <patch|minor|major>"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# RULE: develop always carries the NEXT, unreleased version. release:release
# calls this with "patch" right after tagging; run it by hand with "minor" or
# "major" at a milestone boundary (e.g. 0.1.3 -> 0.2.0), before releasing that
# milestone. Only the new version goes to stdout.

dry_run=false
[[ "${usage_dry_run:-false}" == "true" ]] && dry_run=true

old="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
if [[ ! "$old" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
	echo "release:bump: config/version in project.godot is not MAJOR.MINOR.PATCH: '$old'" >&2
	exit 1
fi
major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
case "${usage_part}" in
	patch) new="$major.$minor.$((patch + 1))" ;;
	minor) new="$major.$((minor + 1)).0" ;;
	major) new="$((major + 1)).0.0" ;;
	*) echo "release:bump: part must be patch, minor or major, not '${usage_part}'" >&2; exit 1 ;;
esac

cmd=(perl -pi -e "s/^config\\/version=\"\\Q$old\\E\"\$/config\\/version=\"$new\"/" project.godot)
printf '+' >&2; printf ' %q' "${cmd[@]}" >&2; printf '\n' >&2
$dry_run || "${cmd[@]}"
echo "release:bump: $old -> $new" >&2
echo "$new"
'''
usage = '''
arg "<part>" help="Which part to bump: patch, minor or major"
flag "-n --dry-run" help="Print the command instead of editing project.godot"
'''

[tasks."release:package"]
description = "Package an exported build into build/release/. Usage: mise run release:package <linux|macos>"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
if [[ -z "$version" ]]; then
	echo "release:package: no config/version in project.godot" >&2
	exit 1
fi
# In the release workflow the packaged version must be the released tag.
if [[ "${GITHUB_EVENT_NAME:-}" == "release" && "${GITHUB_REF_NAME:-}" != "v$version" ]]; then
	echo "release:package: tag ${GITHUB_REF_NAME} does not match config/version $version" >&2
	exit 1
fi

mkdir -p build/release
case "${usage_preset}" in
	linux)
		binary=build/linux/megastructure.x86_64
		[[ -f "$binary" ]] || { echo "release:package: $binary missing, run: mise run export linux $binary" >&2; exit 1; }
		files=(megastructure.x86_64)
		[[ -f build/linux/megastructure.pck ]] && files+=(megastructure.pck)
		archive="build/release/megastructure-$version-linux-x86_64.tar.gz"
		tar -czf "$archive" -C build/linux "${files[@]}"
		;;
	macos)
		zip=build/macos/megastructure.zip
		[[ -f "$zip" ]] || { echo "release:package: $zip missing, run: mise run export macos $zip" >&2; exit 1; }
		archive="build/release/megastructure-$version-macos-universal.zip"
		cp "$zip" "$archive"
		;;
	*)
		echo "release:package: unknown preset '${usage_preset}' (linux or macos)" >&2
		exit 1
		;;
esac
echo "$archive"
'''
usage = '''
arg "<preset>" help="Export preset that was exported: linux or macos"
'''

[tasks."release:release"]
description = "Release the version in project.godot: changelog, tag, GitHub release, then bump develop to the next patch"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# RULE: develop always carries the NEXT version. This task tags the version
# that is already in project.godot and never edits the version before
# tagging; right after the release it bumps develop to the next patch. So the
# version in project.godot on develop is always unreleased.
#
# Steps (each file edit is its own task): check preconditions, release:notes,
# release:changelog-roll and commit, tag vVERSION and push, create the GitHub
# release (the release workflow builds and attaches the Linux and macOS
# archives), release:bump patch, commit and push. With --dry-run every command
# is printed instead of executed; the sub-tasks run in their own dry-run mode.

dry_run=false
dry_flag=()
if [[ "${usage_dry_run:-false}" == "true" ]]; then
	dry_run=true
	dry_flag=(--dry-run)
fi

show() { printf '+' >&2; printf ' %q' "$@" >&2; printf '\n' >&2; }
run() { show "$@"; $dry_run || "$@"; }
# Sub-tasks always run; they honour --dry-run themselves.
task() { show mise run "$@"; mise run --quiet "$@"; }

fail() {
	if $dry_run; then
		echo "dry-run: would refuse: $*" >&2
	else
		echo "release:release: $*" >&2
		exit 1
	fi
}

# 1. Preconditions. Fetching is read-only, so it also runs in a dry run.
branch="$(git rev-parse --abbrev-ref HEAD)"
[[ "$branch" == "develop" ]] || fail "not on develop (on $branch)"
[[ -z "$(git status --porcelain)" ]] || fail "working tree is not clean"
show git fetch --quiet origin develop --tags
git fetch --quiet origin develop --tags
if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/develop)" ]]; then
	fail "develop is not up to date with origin/develop"
fi
gh auth status >/dev/null 2>&1 || fail "gh is not authenticated (gh auth login)"

# 2. The version to release is the one develop already carries.
version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
	echo "release:release: config/version in project.godot is not MAJOR.MINOR.PATCH: '$version'" >&2
	exit 1
fi
tag="v$version"
git rev-parse -q --verify "refs/tags/$tag" >/dev/null && fail "tag $tag already exists"

notes="$(mktemp)"
trap 'rm -f "$notes"' EXIT
task release:notes > "$notes"
[[ -s "$notes" ]] || fail "the Unreleased section of docs/CHANGELOG.md is empty"
echo "Releasing $tag"
if $dry_run; then
	echo "dry-run: release notes:"
	sed 's/^/  | /' "$notes"
fi

# 3. Date the changelog section and open a fresh Unreleased one above it.
task release:changelog-roll "$version" "${dry_flag[@]}"
run git add docs/CHANGELOG.md
run git commit -m "chore(release): $version"

# 4. Tag and push develop and the tag together.
run git tag -a "$tag" -m "$tag"
run git push --atomic origin develop "refs/tags/$tag"

# 5. The GitHub release triggers .github/workflows/release.yml.
run gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"

# 6. develop moves on to the next, unreleased version.
next="$(task release:bump patch "${dry_flag[@]}")"
run git add project.godot
run git commit -m "chore(release): start $next"
run git push origin develop

# 7. Where to find it.
if $dry_run; then
	show gh release view "$tag" --json url --jq .url
else
	gh release view "$tag" --json url --jq .url
fi
'''
usage = '''
flag "-n --dry-run" help="Print every command instead of executing it"
'''

[tasks.mcp]
description = "Run the Godot MCP server over stdio (used by .mcp.json)"
run = "godot-mcp"

[tasks.clean]
description = "Remove generated import cache and build output"
run = "rm -rf .godot build"

[tasks.hash-vectors]
depends = ["import"]
description = "Print the shared integer hash reference vectors (see docs/hash_vectors.md)"
run = "godot --headless --path . --script res://scripts/tools/hash_vectors.gd"

[tasks.ui-params]
depends = ["import"]
description = "Print the shader parameter groups the tweak panel discovers"
run = "godot --headless --path . --script res://scripts/tools/registry_dump.gd"

[tasks.seed-check]
depends = ["import"]
description = "Verify seed control, shader uniform and seed-reproducible frames (opens a window)"
run = "godot --path . --script res://scripts/tools/seed_check.gd"

[tasks.screenshot-check]
depends = ["import"]
description = "Verify the HUD screenshot is saved with the HUD hidden (opens a window)"
run = "godot --path . --script res://scripts/tools/screenshot_check.gd"

[tasks.preset-check]
depends = ["import"]
description = "Verify presets save, reload and restore every value bitwise (headless)"
run = "godot --headless --path . --script res://scripts/tools/preset_check.gd"

[tasks.code-map-check]
depends = ["import"]
description = "Verify every file under scripts/, shaders/ and scenes/ is linked from exactly one docs/code note (headless)"
run = "godot --headless --path . --script res://scripts/tools/code_map_check.gd"
