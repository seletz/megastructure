[tools]
godot = "4.7.2-stable"
node = "26"
"npm:@coding-solo/godot-mcp" = "0.1.1"

[env]
# Godot MCP server only honours GODOT_PATH (it never searches PATH), so resolve
# the mise-managed binary after tools are on PATH.
GODOT_PATH = { value = "{{ exec(command='command -v godot') }}", tools = true }

[tasks.editor]
description = "Open the project in the Godot editor"
run = "godot --editor --path ."

[tasks.run]
description = "Run the project (main scene)"
run = "godot --path ."

[tasks.import]
description = "Import all assets headlessly (regenerates .godot/)"
run = "godot --headless --path . --import"

[tasks.check-scripts]
description = "Parse every GDScript file and fail on errors"
depends = ["import"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
status=0
while IFS= read -r -d '' file; do
	godot --headless --path . --check-only --script "res://${file#./}" || status=1
done < <(find . -path ./.godot -prune -o -name '*.gd' -print0)
exit "$status"
'''

[tasks.check]
description = "Import assets, parse scripts and verify the project loads headlessly"
depends = ["import", "check-scripts"]
run = "godot --headless --editor --path . --quit"

[tasks.templates]
description = "Download export templates for the pinned Godot version (skips if installed)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# "4.7.2.stable.official.ed1daf0bf" -> "4.7.2.stable"
full_version="$(godot --headless --version | tail -n 1)"
version="$(printf '%s\n' "$full_version" | cut -d. -f1-4)"
IFS=. read -r major minor patch status <<< "$version"
if [[ -z "${status:-}" ]]; then
	echo "Unexpected Godot version string: $full_version" >&2
	exit 1
fi

# Release tags drop a zero patch level: 4.7.0 ships as "4.7-stable".
if [[ "$patch" == "0" ]]; then
	tag="${major}.${minor}-${status}"
else
	tag="${major}.${minor}.${patch}-${status}"
fi

data_home="${XDG_DATA_HOME:-$HOME/.local/share}"
dest="$data_home/godot/export_templates/$version"
if [[ -f "$dest/version.txt" ]]; then
	echo "Export templates $version already installed in $dest"
	exit 0
fi

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

url="https://github.com/godotengine/godot/releases/download/${tag}/Godot_v${tag}_export_templates.tpz"
echo "Downloading $url"
progress=(--silent --show-error)
[[ -t 2 ]] && progress=(--progress-bar)
curl --fail --location "${progress[@]}" --output "$tmp/templates.tpz" "$url"
unzip -q "$tmp/templates.tpz" -d "$tmp"

mkdir -p "$(dirname "$dest")"
rm -rf "$dest"
mv "$tmp/templates" "$dest"
echo "Installed export templates $version in $dest"
'''

[tasks.export]
description = "Export a release build. Usage: mise run export <preset> <output-path>"
depends = ["import"]
run = [
	'mkdir -p "$(dirname "${usage_output}")"',
	'godot --headless --path . --export-release "${usage_preset}" "${usage_output}"',
]
usage = '''
arg "<preset>" help="Export preset name from export_presets.cfg"
arg "<output>" help="Output file path, e.g. build/linux/megastructure.x86_64"
'''

[tasks.export-debug]
description = "Export a debug build. Usage: mise run export-debug <preset> <output-path>"
depends = ["import"]
run = [
	'mkdir -p "$(dirname "${usage_output}")"',
	'godot --headless --path . --export-debug "${usage_preset}" "${usage_output}"',
]
usage = '''
arg "<preset>" help="Export preset name from export_presets.cfg"
arg "<output>" help="Output file path"
'''

[tasks.mcp]
description = "Run the Godot MCP server over stdio (used by .mcp.json)"
run = "godot-mcp"

[tasks.clean]
description = "Remove generated import cache and build output"
run = "rm -rf .godot build"

[tasks.hash-vectors]
description = "Print the shared integer hash reference vectors (see docs/hash_vectors.md)"
run = "godot --headless --path . --script res://scripts/tools/hash_vectors.gd"
