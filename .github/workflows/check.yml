name: check

on:
  pull_request:
  push:
    branches: [develop]
  schedule:
    # Nightly full tier on the default branch.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libfontconfig1
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - uses: jdx/mise-action@v2
        with:
          cache: true

      # Pull requests run the quick tier; pushes to develop, the nightly
      # schedule and manual runs run the full tier.
      - name: mise run check
        if: github.event_name == 'pull_request'
        run: mise run check

      - name: mise run check-full
        if: github.event_name != 'pull_request'
        run: mise run check-full
