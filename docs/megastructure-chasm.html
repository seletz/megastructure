<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Megastructure — the chasm</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #hint {
    position:fixed; left:12px; bottom:10px; font:12px/1.5 system-ui, sans-serif;
    color:rgba(255,255,255,.45); pointer-events:none; user-select:none; max-width:70vw;
  }
  #seed {
    position:fixed; right:12px; bottom:10px; font:12px system-ui, sans-serif;
    color:rgba(255,255,255,.55); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
    padding:5px 9px; border-radius:3px; cursor:pointer;
  }
  #seed:focus-visible { outline:1px solid #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">You are slowly descending. Space pauses.<br>Drag to look. WASD / arrows move, Q E up/down, Shift fast. Touch: one finger looks, two move.</div>
<button id="seed">New seed</button>

<script id="vs" type="x-shader">#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }
</script>

<script id="fs" type="x-shader">#version 300 es
precision highp float;
precision highp int;
out vec4 fragColor;
uniform vec2  uRes;
uniform float uTime;
uniform uint  uSeed;
uniform vec3  uCam;
uniform vec2  uRot;

// ---------- structure parameters (metres) ----------
const float D   = 140.0;  // half width of the chasm
const float H   = 6.0;    // stratum height on the facades
const float DK  = 30.0;   // heavy deck every DK metres
const float TR  = 60.0;   // terrace cell (facade recess decisions)
const float BUT = 40.0;   // buttress spacing
const float PIL = 110.0;  // pillar cell along x
const float BRY = 40.0;   // bridge cell in y
const float BRX = 90.0;   // bridge cell in x
const float CAB = 25.0;   // cable grid

// shared integer hash, bit-identical with shaders/include/hash.gdshaderinc,
// scripts/hash.gd and hash3() below (reference values: hash_vectors.md)
uint pcg(uint v){
  uint s = v*747796405u + 2891336453u;
  uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
float hash3(ivec3 cell, uint salt){
  uvec3 c = uvec3(cell);
  uint h = pcg(uSeed ^ pcg(salt));
  h = pcg(h ^ c.x); h = pcg(h ^ c.y); h = pcg(h ^ c.z);
  return float(h >> 8u) / 16777216.0;
}
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }
float sdBox2(vec2 p, vec2 b){ vec2 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,q.y),0.); }

// one facade, in local coords: zz = distance in front of the wall plane (positive = void)
float facade(vec3 p, float side, out float mat){
  mat = 0.0;
  float z = abs(p.z);
  // terrace recess per coarse cell
  vec2 tid = floor(vec2(p.x, p.y)/TR);
  ivec3 tc = ivec3(ivec2(tid), int(side));
  float ht = hash3(tc, 3u);
  float rec = (ht < 0.32) ? 6.0 + 14.0*hash3(tc, 5u) : 0.0;
  vec2 tl = vec2(p.x, p.y) - (tid+0.5)*TR;
  float border = TR*0.5 - max(abs(tl.x), abs(tl.y));
  float zz = (D + rec) - z;

  float fy = mod(p.y + H*0.5, H) - H*0.5;
  float ky = mod(p.y + DK*0.5, DK) - DK*0.5;
  float bx = mod(p.x + BUT*0.5, BUT) - BUT*0.5;

  float d = zz;                                                    // the wall mass
  d = min(d, sdBox2(vec2(fy, zz-0.6), vec2(0.22, 0.6)));           // ledge per stratum
  d = min(d, sdBox2(vec2(ky, zz-2.2), vec2(0.7, 2.2)));            // heavy deck
  float but = sdBox2(vec2(bx, zz-5.0), vec2(1.8, 5.0));            // buttress
  vec2 bcell = vec2(floor(p.x/BUT), floor(p.y/(TR*2.0)));
  if (hash3(ivec3(ivec2(bcell), int(side)), 7u) < 0.25) {
    // removed: the buttress continues in the y-neighbour cell — distance to that cell, within the profile
    float ly = p.y - (bcell.y+0.5)*TR*2.0;
    but = max(but, TR - abs(ly));
  }
  d = min(d, but);

  // openings punched into the wall
  vec2 oid = floor(vec2(p.x/8.0, p.y/H));
  float ho = hash3(ivec3(ivec2(oid), int(side)), 11u);
  float ox = p.x - (oid.x+0.5)*8.0;
  float oy = p.y - (oid.y+0.5)*H;
  float op = sdBox(vec3(ox, oy, zz+3.5), vec3(2.6, 1.7, 3.5));
  if (ho < 0.5) op = 1e5;
  d = max(d, -op);
  if (ho > 0.955 && zz < -0.2) mat = 2.0;                          // a few lit openings

  // conservative near terrace borders: a neighbour may be un-recessed, with up to 10 m of protrusions
  if (rec > 0.0) d = min(d, max(max(border, (D - z) - 10.0), 0.03));
  return d;
}

float map(vec3 p, out float mat){
  float mA, mB;
  float d = facade(p, 1.0, mA);
  float dB = facade(vec3(p.x, p.y, -p.z), -1.0, mB);
  mat = (dB < d) ? mB : mA;
  d = min(d, dB);

  // pillars standing free in the void
  float pid = floor(p.x/PIL);
  ivec3 pc = ivec3(int(pid), 0, 0);
  if (hash3(pc, 21u) < 0.55) {
    float r = 4.0 + 8.0*hash3(pc, 22u);
    float xo = (hash3(pc, 23u) - 0.5) * (PIL - 2.0*r - 6.0);
    float zo = (hash3(pc, 24u) - 0.5) * (2.0*D - 2.0*r - 40.0);
    vec2 q = vec2(p.x - (pid+0.5)*PIL - xo, p.z - zo);
    float pil = length(q) - r;
    // rings around the pillar every deck
    float ky = mod(p.y + DK*0.5, DK) - DK*0.5;
    float ring = max(length(q) - (r+2.5), abs(ky) - 0.8);
    float pilAll = min(pil, ring);
    if (pilAll < d) { d = pilAll; mat = 0.0; }
  }

  // bridges spanning the chasm
  vec2 bid = floor(vec2(p.x/BRX, p.y/BRY));
  ivec3 bc = ivec3(ivec2(bid), 0);
  float hb = hash3(bc, 31u);
  if (hb < 0.5) {
    float xo = (hash3(bc, 32u) - 0.5) * (BRX - 14.0);
    float yo = (hash3(bc, 33u) - 0.5) * (BRY - 8.0);
    vec3 q = vec3(p.x - (bid.x+0.5)*BRX - xo, p.y - (bid.y+0.5)*BRY - yo, p.z);
    float br;
    if (hash3(bc, 34u) > 0.7) br = length(q.xy) - 3.5;                 // tube
    else br = sdBox(q, vec3(3.0, 1.4, D+30.0));                              // slab bridge
    if (hash3(bc, 35u) < 0.4) {                                         // broken span
      float zb = (hash3(bc, 36u) - 0.5) * (2.0*D - 60.0);
      br = max(br, -sdBox(vec3(q.x, q.y, p.z - zb), vec3(10.0, 10.0, 8.0 + 14.0*hash3(bc, 37u))));
    }
    if (br < d) { d = br; mat = 1.0; }
  }

  // hanging cables
  vec2 cid = floor(p.xz/CAB);
  ivec3 cc = ivec3(ivec2(cid), 0);
  if (hash3(cc, 41u) < 0.22) {
    vec2 co = (vec2(hash3(cc, 42u), hash3(cc, 43u)) - 0.5) * (CAB - 3.0);
    vec2 q = p.xz - (cid+0.5)*CAB - co;
    float cab = length(q) - (0.12 + 0.25*hash3(cc, 44u));
    cab = max(cab, abs(p.z) - (D - 4.0));   // no cables within 4 m of the facades, conservatively
    if (cab < d) { d = cab; mat = 1.0; }
  }
  return d;
}

vec3 normal(vec3 p){
  float m; const vec2 e = vec2(1.0,-1.0)*0.004;
  return normalize( e.xyy*map(p+e.xyy,m) + e.yyx*map(p+e.yyx,m) + e.yxy*map(p+e.yxy,m) + e.xxx*map(p+e.xxx,m) );
}
float ao(vec3 p, vec3 n){
  float m, occ = 0.0, sca = 1.0;
  for (int i=1;i<=5;i++){
    float h = 0.15 + 1.6*float(i)/5.0;
    occ += (h - map(p + n*h, m)) * sca;
    sca *= 0.65;
  }
  return clamp(1.0 - 0.9*occ, 0.0, 1.0);
}
float shadow(vec3 ro, vec3 rd){
  float m, res = 1.0, t = 0.6;
  for (int i=0;i<22;i++){
    float h = map(ro + rd*t, m);
    res = min(res, 10.0*h/t);
    t += clamp(h, 0.4, 12.0);
    if (res < 0.02 || t > 160.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes) / uRes.y;
  float cy = cos(uRot.x), sy = sin(uRot.x), cp = cos(uRot.y), sp = sin(uRot.y);
  vec3 fwd   = vec3(cp*sy, sp, cp*cy);
  vec3 right = vec3(-cy, 0.0, sy);   // right-handed: looking down +Z, screen-right is -X
  vec3 up    = cross(right, fwd);
  vec3 rd = normalize(fwd*1.15 + right*uv.x + up*uv.y);
  vec3 ro = uCam;

  float t = 0.0, m = 0.0;
  const float MAXD = 1400.0;
  bool hit = false;
  for (int i=0;i<180;i++){
    vec3 p = ro + rd*t;
    float d = map(p, m);
    if (d < 0.0006*t + 0.002) { hit = true; break; }
    t += d*0.8;
    if (t > MAXD) break;
  }

  // fog: light bleeds down from far above, nothing comes up from below
  vec3 fogCol = mix(vec3(0.004,0.004,0.006), vec3(0.075,0.085,0.105), smoothstep(-0.35, 0.7, rd.y));
  vec3 L = normalize(vec3(0.25, 1.0, 0.15));

  vec3 col = vec3(0.0);
  if (hit) {
    vec3 p = ro + rd*t;
    vec3 n = normal(p);
    float occ = ao(p, n);
    float sh = shadow(p + n*0.3, L);

    float grime = hash3(ivec3(floor(p*0.7)), 50u)*0.35 + hash3(ivec3(floor(p*0.12)), 51u)*0.3;
    vec3 alb = (m > 0.5 && m < 1.5) ? vec3(0.30,0.31,0.34)*(0.7+0.3*grime) : vec3(0.50,0.50,0.48)*(0.55+0.45*grime);

    float diff = max(dot(n, L), 0.0);
    vec3 key = vec3(0.9, 0.95, 1.0) * diff * sh * 1.3;
    vec3 sky = vec3(0.12, 0.14, 0.18) * (0.55 + 0.45*n.y);
    vec3 ground = vec3(0.02, 0.02, 0.025) * (0.5 - 0.5*n.y);

    // small headlight so nearby structure still reads
    vec3 Lh = ro - p; float dl = length(Lh); Lh /= dl;
    float head = max(dot(n, Lh), 0.0) * 40.0 / (1.0 + 0.1*dl*dl);

    col = alb * (key + (sky + ground)*occ + head*vec3(1.0,0.9,0.75));
    col *= 0.5 + 0.5*occ;
    if (m > 1.5) col += vec3(1.0, 0.72, 0.42) * 1.8;   // lit opening
  }
  float fogAmt = 1.0 - exp(-0.0032*t);
  col = mix(col, fogCol, fogAmt);

  col = 1.0 - exp(-col*1.7);
  float g = hash3(ivec3(ivec2(gl_FragCoord.xy), int(uTime*24.0)), 60u) - 0.5;
  col += g*0.04;
  col *= 1.0 - 0.3*dot(uv*0.6, uv*0.6);
  col = pow(max(col,0.0), vec3(1.0/2.2));
  fragColor = vec4(col, 1.0);
}
</script>

<script>
// JS mirror of the shader hash, for checking vectors from the console:
// hash3(state.seed, x, y, z, salt)
function pcg(v){
  const s = (Math.imul(v, 747796405) + 2891336453) >>> 0;
  const w = Math.imul((s >>> ((s >>> 28) + 4)) ^ s, 277803737);
  return ((w >>> 22) ^ w) >>> 0;
}
function hash3(seed, x, y, z, salt){
  let h = pcg((seed ^ pcg(salt)) >>> 0);
  h = pcg((h ^ x) >>> 0); h = pcg((h ^ y) >>> 0); h = pcg((h ^ z) >>> 0);
  return (h >>> 8) / 16777216;
}

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false});
if (!gl) { document.getElementById('hint').textContent = 'WebGL2 is not available in this browser.'; }

function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, document.getElementById('vs').textContent.trim()));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent.trim()));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U = n => gl.getUniformLocation(prog, n);
const uRes=U('uRes'), uTime=U('uTime'), uSeed=U('uSeed'), uCam=U('uCam'), uRot=U('uRot');

const state = {
  pos: [20.0, 0.0, -30.0],
  yaw: 0.9, pitch: -0.28,
  seed: Math.random()*2**32>>>0,
  keys: new Set(),
  descend: true,
};
const scale = Math.min(window.devicePixelRatio, 2) * 0.5;
function resize(){
  canvas.width  = Math.floor(innerWidth  * scale);
  canvas.height = Math.floor(innerHeight * scale);
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize', resize); resize();

addEventListener('keydown', e => {
  state.keys.add(e.key.toLowerCase());
  if (e.key==='r') reseed();
  if (e.key===' ') { state.descend = !state.descend; e.preventDefault(); }
});
addEventListener('keyup', e => state.keys.delete(e.key.toLowerCase()));

let drag = null;
canvas.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup',   () => drag = null);
canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerType === 'touch') return;
  look(e.clientX - drag.x, e.clientY - drag.y); drag = {x:e.clientX, y:e.clientY};
});
function look(dx, dy){
  state.yaw   -= dx * 0.004;
  state.pitch  = Math.max(-1.5, Math.min(1.5, state.pitch - dy * 0.004));
}
let lastCentroid = null, lastTap = 0;
canvas.addEventListener('touchstart', e => {
  lastCentroid = null; e.preventDefault();
  const now = performance.now();
  if (e.touches.length === 1 && now - lastTap < 300) state.descend = !state.descend;
  lastTap = now;
}, {passive:false});
canvas.addEventListener('touchend',  () => { lastCentroid = null; }, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const pts = [...e.touches].map(t => [t.clientX, t.clientY]);
  const c = pts.reduce((a,p)=>[a[0]+p[0]/pts.length, a[1]+p[1]/pts.length],[0,0]);
  if (lastCentroid) {
    const dx = c[0]-lastCentroid[0], dy = c[1]-lastCentroid[1];
    if (pts.length === 1) look(dx, dy); else moveRel(dx*0.12, -dy*0.12);
  }
  lastCentroid = c;
}, {passive:false});

function basis(){
  const cy=Math.cos(state.yaw), sy=Math.sin(state.yaw), cp=Math.cos(state.pitch), sp=Math.sin(state.pitch);
  return { fwd:[cp*sy, sp, cp*cy], right:[-cy, 0, sy] };
}
function moveRel(strafe, forward, upv=0){
  const b = basis();
  for (let i=0;i<3;i++) state.pos[i] += b.fwd[i]*forward + b.right[i]*strafe;
  state.pos[1] += upv;
}
function reseed(){ state.seed = Math.random()*2**32>>>0; }
document.getElementById('seed').addEventListener('click', reseed);

let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, 0.1); last = now;
  const k = state.keys;
  const sp = (k.has('shift') ? 60 : 14) * dt;
  let f=0, s=0, u=0;
  if (k.has('w')||k.has('arrowup'))    f += sp;
  if (k.has('s')||k.has('arrowdown'))  f -= sp;
  if (k.has('d')||k.has('arrowright')) s += sp;
  if (k.has('a')||k.has('arrowleft'))  s -= sp;
  if (k.has('e')) u += sp;
  if (k.has('q')) u -= sp;
  if (f||s||u) moveRel(s, f, u);
  if (state.descend) state.pos[1] -= 2.2*dt;

  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, now/1000);
  gl.uniform1ui(uSeed, state.seed);
  gl.uniform3fv(uCam, state.pos);
  gl.uniform2f(uRot, state.yaw, state.pitch);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
